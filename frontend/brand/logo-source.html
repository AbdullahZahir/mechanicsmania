<!doctype html>
<meta charset="utf-8">
<title>MechanicsMania logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#555;margin:0;display:flex;gap:20px;padding:20px;flex-wrap:wrap}canvas{background:#0003}</style>
<canvas id="mark"  width="1024" height="1024" style="width:260px"></canvas>
<canvas id="word"  width="1024" height="1024" style="width:260px"></canvas>
<canvas id="wide"  width="1200" height="630"  style="width:420px"></canvas>
<script>
/* The mark is the app's own favicon, redrawn from the identical path data so
   the two can never drift apart. The favicon is authored in a 64-unit box;
   everything below scales from that rather than being re-traced by eye. */
const BG = "#14181c", INK = "#e8e6e1", BRASS = "#c9a227", MUTED = "#a4a8ad";
const BODY = new Path2D("M32 15c5 7 6 14 6 21v5H26v-5c0-7 1-14 6-21z");
const FINS = new Path2D("M26 34l-6 9h6M38 34l6 9h-6");

/* Draw the favicon at any size. `disc` paints the dark ground the rocket sits
   on; turn it off where the canvas already supplies one. */
function rocket(c, cx, cy, r, disc) {
  const k = r / 30;                       // the favicon's circle is r=30 of 64
  c.save();
  if (disc !== false) {
    c.fillStyle = BG;
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
  }
  c.translate(cx, cy);
  c.scale(k, k);
  c.translate(-32, -32);                  // the 64-box centre
  c.translate(32, 32); c.rotate(-40 * Math.PI / 180); c.translate(-32, -32);
  c.strokeStyle = BRASS;
  c.lineWidth = 3;
  c.lineJoin = "round";
  c.lineCap = "round";
  c.stroke(BODY);
  c.stroke(FINS);
  c.restore();
}

// -------------------------------------------------- 1. the mark, on its own
(function () {
  const c = document.getElementById("mark").getContext("2d");
  c.clearRect(0, 0, 1024, 1024);          // transparent outside the disc
  rocket(c, 512, 512, 496);
})();

// -------------------------------------------- 2. the mark with the wordmark
(function () {
  const c = document.getElementById("word").getContext("2d");
  c.fillStyle = BG; c.fillRect(0, 0, 1024, 1024);
  rocket(c, 512, 430, 300, false);
  c.textAlign = "center";
  c.fillStyle = INK;
  c.font = '700 104px Spectral, Georgia, serif';
  c.fillText("MechanicsMania", 512, 830);
})();

// ------------------------------------------------------------- 3. a banner
(function () {
  const c = document.getElementById("wide").getContext("2d");
  const W = 1200, H = 630;
  c.fillStyle = BG; c.fillRect(0, 0, W, H);
  rocket(c, 268, 315, 178, false);
  c.textAlign = "left";
  c.fillStyle = INK;
  c.font = '700 88px Spectral, Georgia, serif';
  c.fillText("MechanicsMania", 470, 292);
  c.fillStyle = BRASS;
  c.font = '600 36px Spectral, Georgia, serif';
  c.fillText("Predict it. Then watch the apparatus.", 470, 360);
  c.fillStyle = MUTED;
  c.font = '400 28px Spectral, Georgia, serif';
  c.fillText("Abdullah Zahir", 470, 424);
})();

document.title = "ready";
</script>
